<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Dashboard Petugas | Perpustakaan Nusantara
    </title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            background: #f4efe5;

            color: #35291f;

        }


        header {

            background: #3b2418;

            color: #f7ead3;

            padding: 18px 6%;

            display: flex;

            justify-content: space-between;

            align-items: center;

            border-bottom:
                4px solid #b58b4b;

        }


        .logo {

            font-size: 23px;

        }


        .logout {

            background: transparent;

            border:
                1px solid #c7a976;

            color: white;

            padding: 8px 15px;

            border-radius: 5px;

            cursor: pointer;

        }


        .container {

            width: 88%;

            max-width: 1250px;

            margin: 35px auto;

        }


        .title {

            margin-bottom: 30px;

        }


        .title h1 {

            font-size: 34px;

            font-weight: normal;

            color: #4a2f20;

        }


        .title p {

            font-family: Arial, sans-serif;

            color: #76695e;

            margin-top: 5px;

        }


        .stats {

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 18px;

            margin-bottom: 30px;

        }


        .stat {

            background: #fffaf1;

            border:
                1px solid #d6c5a8;

            border-radius: 7px;

            padding: 22px;

        }


        .stat-number {

            font-size: 30px;

            color: #5a3824;

        }


        .stat-text {

            font-family: Arial, sans-serif;

            font-size: 12px;

            color: #75685d;

        }


        .panel {

            background: #fffaf1;

            border:
                1px solid #d6c5a8;

            border-radius: 8px;

            padding: 30px;

            margin-bottom: 30px;

        }


        .panel h2 {

            font-weight: normal;

            color: #4a2f20;

            margin-bottom: 20px;

        }


        table {

            width: 100%;

            border-collapse: collapse;

            font-family: Arial, sans-serif;

            font-size: 13px;

        }


        th {

            text-align: left;

            background: #eee2cf;

            padding: 13px;

            white-space: nowrap;

        }


        td {

            padding: 13px;

            border-bottom:
                1px solid #ded0bb;

            vertical-align: middle;

        }


        .btn {

            border: none;

            border-radius: 4px;

            padding: 7px 11px;

            font-family: Arial, sans-serif;

            font-size: 11px;

            cursor: pointer;

            margin: 2px;

        }


        .approve {

            background: #557b55;

            color: white;

        }


        .reject {

            background: #98483e;

            color: white;

        }


        .return {

            background: #765331;

            color: white;

        }


        .approve:hover,
        .reject:hover,
        .return:hover {

            opacity: .85;

        }


        .approved {

            color: #46704a;

            font-weight: bold;

        }


        .rejected {

            color: #9b3c32;

            font-weight: bold;

        }


        .pending {

            color: #99702e;

            font-weight: bold;

        }


        .returned {

            color: #5c625c;

            font-weight: bold;

        }


        .late {

            color: #a33c30;

            font-weight: bold;

        }


        .empty {

            text-align: center;

            color: #827568;

            padding: 35px;

        }


        .overdue {

            background: #f8e2dc;

        }


        .normal {

            color: #55704f;

        }


        @media(max-width:900px) {

            .stats {

                grid-template-columns:
                    repeat(2, 1fr);

            }

            table {

                display: block;

                overflow-x: auto;

            }

        }


        @media(max-width:500px) {

            .stats {

                grid-template-columns: 1fr;

            }

            .title h1 {

                font-size: 28px;

            }

        }

    </style>

</head>


<body>


<header>


    <div class="logo">

        📚 Perpustakaan Nusantara

    </div>


    <button
        class="logout"
        onclick="logout()"
    >

        Keluar

    </button>


</header>



<main class="container">


    <div class="title">

        <h1>
            Dashboard Petugas
        </h1>

        <p>
            Kelola peminjaman dan pengembalian buku anggota.
        </p>

    </div>



    <!-- STATISTIK -->

    <div class="stats">


        <div class="stat">

            <div
                class="stat-number"
                id="total"
            >
                0
            </div>

            <div class="stat-text">
                Total Permintaan
            </div>

        </div>


        <div class="stat">

            <div
                class="stat-number"
                id="pending"
            >
                0
            </div>

            <div class="stat-text">
                Menunggu Persetujuan
            </div>

        </div>


        <div class="stat">

            <div
                class="stat-number"
                id="borrowed"
            >
                0
            </div>

            <div class="stat-text">
                Sedang Dipinjam
            </div>

        </div>


        <div class="stat">

            <div
                class="stat-number"
                id="returned"
            >
                0
            </div>

            <div class="stat-text">
                Sudah Dikembalikan
            </div>

        </div>


    </div>



    <!-- PERMINTAAN PEMINJAMAN -->

    <section class="panel">


        <h2>
            📋 Daftar Peminjaman
        </h2>


        <table>


            <thead>

                <tr>

                    <th>
                        Anggota
                    </th>

                    <th>
                        Buku
                    </th>

                    <th>
                        Tanggal Pinjam
                    </th>

                    <th>
                        Jatuh Tempo
                    </th>

                    <th>
                        Status
                    </th>

                    <th>
                        Aksi
                    </th>

                </tr>

            </thead>


            <tbody
                id="loanTable"
            >

            </tbody>


        </table>


    </section>


</main>



<script>


/* ==================================================
   CEK LOGIN PETUGAS
================================================== */


if (
    localStorage.getItem(
        "loginPetugas"
    ) !== "true"
) {

    window.location.href =
        "login-petugas.html";

}



/* ==================================================
   HITUNG JATUH TEMPO
   7 HARI DARI TANGGAL PERSETUJUAN
================================================== */


function hitungJatuhTempo() {

    const tanggal =
        new Date();

    tanggal.setDate(
        tanggal.getDate() + 7
    );


    return tanggal.toLocaleDateString(
        "id-ID"
    );

}



/* ==================================================
   CEK TERLAMBAT
================================================== */


function sudahJatuhTempo(
    tanggalTempo
) {

    if (!tanggalTempo) {

        return false;

    }


    const sekarang =
        new Date();


    const tempo =
        new Date(
            tanggalTempo
        );


    return sekarang > tempo;

}



/* ==================================================
   TAMPILKAN DATA
================================================== */


function tampilkanData() {


    const loans =
        JSON.parse(
            localStorage.getItem(
                "peminjaman"
            )
        ) || [];


    const table =
        document.getElementById(
            "loanTable"
        );


    table.innerHTML = "";


    let pending = 0;

    let borrowed = 0;

    let returned = 0;



    loans.forEach(
        function(
            loan,
            index
        ) {


            /* STATISTIK */

            if (
                loan.status ===
                "Menunggu"
            ) {

                pending++;

            }


            if (
                loan.status ===
                "Disetujui"
            ) {

                borrowed++;

            }


            if (
                loan.status ===
                "Dikembalikan"
            ) {

                returned++;

            }



            /* STATUS */

            let statusClass =
                "pending";


            if (
                loan.status ===
                "Disetujui"
            ) {

                statusClass =
                    "approved";

            }


            if (
                loan.status ===
                "Ditolak"
            ) {

                statusClass =
                    "rejected";

            }


            if (
                loan.status ===
                "Dikembalikan"
            ) {

                statusClass =
                    "returned";

            }



            /* CEK JATUH TEMPO */

            let tempoText =
                "-";


            let tempoClass =
                "";


            if (
                loan.dueDate &&
                loan.status === "Disetujui"
            ) {

                tempoText =
                    loan.dueDate;


                if (
                    sudahJatuhTempo(
                        loan.dueDate
                    )
                ) {

                    tempoClass =
                        "late";

                    tempoText +=
                        " (Terlambat)";

                }

                else {

                    tempoClass =
                        "normal";

                }

            }



            /* TOMBOL AKSI */

            let action = "-";


            if (
                loan.status ===
                "Menunggu"
            ) {

                action = `

                    <button
                        class="btn approve"
                        onclick="ubahStatus(
                            ${index},
                            'Disetujui'
                        )"
                    >

                        Setujui

                    </button>


                    <button
                        class="btn reject"
                        onclick="ubahStatus(
                            ${index},
                            'Ditolak'
                        )"
                    >

                        Tolak

                    </button>

                `;

            }



            else if (
                loan.status ===
                "Menunggu Pengembalian"
            ) {

                action = `

                    <button
                        class="btn return"
                        onclick="ubahStatus(
                            ${index},
                            'Dikembalikan'
                        )"
                    >

                        Konfirmasi Pengembalian

                    </button>

                `;

            }



            /* TABEL */

            table.innerHTML += `

                <tr
                    class="${
                        tempoClass === "late"
                        ? "overdue"
                        : ""
                    }"
                >

                    <td>
                        ${loan.member}
                    </td>

                    <td>
                        ${loan.book}
                    </td>

                    <td>
                        ${loan.borrowDate || loan.date}
                    </td>

                    <td
                        class="${tempoClass}"
                    >

                        ${tempoText}

                    </td>

                    <td>

                        <span
                            class="${statusClass}"
                        >

                            ${loan.status}

                        </span>

                    </td>

                    <td>

                        ${action}

                    </td>

                </tr>

            `;

        }
    );



    /* JIKA KOSONG */

    if (
        loans.length === 0
    ) {

        table.innerHTML = `

            <tr>

                <td
                    colspan="6"
                    class="empty"
                >

                    Belum ada data peminjaman.

                </td>

            </tr>

        `;

    }



    /* UPDATE STATISTIK */

    document
        .getElementById("total")
        .textContent =
        loans.length;


    document
        .getElementById("pending")
        .textContent =
        pending;


    document
        .getElementById("borrowed")
        .textContent =
        borrowed;


    document
        .getElementById("returned")
        .textContent =
        returned;

}



/* ==================================================
   UBAH STATUS
================================================== */


function ubahStatus(
    index,
    status
) {


    const loans =
        JSON.parse(
            localStorage.getItem(
                "peminjaman"
            )
        ) || [];


    const loan =
        loans[index];


    /* JIKA DISETUJUI */

    if (
        status ===
        "Disetujui"
    ) {


        loan.status =
            "Disetujui";


        loan.borrowDate =
            new Date()
            .toLocaleDateString(
                "id-ID"
            );


        loan.dueDate =
            hitungJatuhTempo();


        alert(
            "Peminjaman disetujui.\n\n" +
            "Buku: " +
            loan.book +
            "\nJatuh tempo: " +
            loan.dueDate
        );

    }



    /* JIKA DITOLAK */

    else if (
        status ===
        "Ditolak"
    ) {


        loan.status =
            "Ditolak";


        alert(
            "Permintaan peminjaman ditolak."
        );

    }



    /* JIKA DIKEMBALIKAN */

    else if (
        status ===
        "Dikembalikan"
    ) {


        loan.status =
            "Dikembalikan";


        loan.returnDate =
            new Date()
            .toLocaleDateString(
                "id-ID"
            );


        alert(
            "Pengembalian buku berhasil dikonfirmasi."
        );

    }


    localStorage.setItem(
        "peminjaman",
        JSON.stringify(
            loans
        )
    );


    tampilkanData();

}



tampilkanData();



/* ==================================================
   LOGOUT
================================================== */


function logout() {


    localStorage.removeItem(
        "loginPetugas"
    );


    window.location.href =
        "login-petugas.html";

}


</script>


</body>

</html>
